[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ult-orchestrator"
version = "0.1.0"
description = "Scaffold workspace for orchestrator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.7,<1.10",
    "dagster-dbt>=0.23,<0.27",
    "pendulum>=3.2",
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "dbt-core",
    "dbt-duckdb",
    "pytest",
    "pytest-asyncio",
    "mypy",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:main"
orchestrator-rerun = "orchestrator.cli.rerun:main"
# min-cycle is the assembly-e2e public CLI; argv contract defined by
# assembly/src/assembly/tests/e2e/fixtures/minimal_cycle/manifest.yaml
min-cycle = "orchestrator.cli.min_cycle:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
