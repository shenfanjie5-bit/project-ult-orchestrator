[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ult-orchestrator"
version = "0.1.1"
description = "Dagster-based Phase 0-3 cycle orchestration for project-ult."
readme = "README.md"
# Codex stage 2.5 review #3 fix: dagster<1.10 has no Python 3.13/3.14
# wheels, so requires-python must cap at <3.13 to match the actually-
# supported interpreter range. CI also pins 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.7,<1.10",
    "dagster-dbt>=0.23,<0.27",
    "pendulum>=3.2",
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "dbt-core",
    "dbt-duckdb",
    "pytest",
    "pytest-asyncio",
    "mypy",
]
# Cross-repo schema source-of-truth pin (iron rule #6 + main-core
# stage 2.3 follow-up #1 sub-rule). Required by tests/contract for
# cross-repo alignment.
contracts-schemas = [
    "project-ult-contracts @ git+https://github.com/shenfanjie5-bit/project-ult-contracts.git@v0.1.2",
]
# Shared regression fixtures bundled with project-ult-audit-eval.
# Pinned to v0.2.4 (project-wide canonical_entity_id format
# reconciliation: every shared case now uses the runtime-aligned dot
# form ENT_STOCK_<symbol>.<exchange>; iron rule #6).
shared-fixtures = [
    "project-ult-audit-eval @ git+https://github.com/shenfanjie5-bit/project-ult-audit-eval.git@v0.2.4",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:main"
orchestrator-rerun = "orchestrator.cli.rerun:main"
# min-cycle is the assembly-e2e public CLI; argv contract defined by
# assembly/src/assembly/tests/e2e/fixtures/minimal_cycle/manifest.yaml
min-cycle = "orchestrator.cli.min_cycle:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
